name: Nimbus CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  AWS_REGION: us-east-1
  PROJECT: nimbus

jobs:
  # ── Job 1: Lint and Test ───────────────────────
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run lint
        working-directory: backend
        run: npm run lint --if-present

  # ── Job 2: Secret Scan ────────────────────────
  secret-scan:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          extra_args: --only-verified

  # ── Job 3: Build and Push Images ──────────────
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    needs: [test, secret-scan]
    if: github.event_name == 'push'

    permissions:
      id-token: write
      contents: read

    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
      env: ${{ steps.env.outputs.env }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "env=prod" >> $GITHUB_OUTPUT
          else
            echo "env=dev" >> $GITHUB_OUTPUT
          fi

      - name: Debug env output
        run: echo "ENV is ${{ steps.env.outputs.env }}"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/nimbus-github-actions-${{ steps.env.outputs.env }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image tag
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Image tag: ${SHORT_SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT }}-backend-${{ steps.env.outputs.env }}:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT }}-backend-${{ steps.env.outputs.env }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT }}-frontend-${{ steps.env.outputs.env }}:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT }}-frontend-${{ steps.env.outputs.env }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 4: Deploy to ECS ──────────────────────
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'
    environment: ${{ needs.build-and-push.outputs.env }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/nimbus-github-actions-${{ needs.build-and-push.outputs.env }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy backend to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.PROJECT }}-cluster-${{ needs.build-and-push.outputs.env }} \
            --service ${{ env.PROJECT }}-backend-${{ needs.build-and-push.outputs.env }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Deploy frontend to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.PROJECT }}-cluster-${{ needs.build-and-push.outputs.env }} \
            --service ${{ env.PROJECT }}-frontend-${{ needs.build-and-push.outputs.env }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for backend to stabilize
        run: |
          echo "Waiting for backend deployment to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.PROJECT }}-cluster-${{ needs.build-and-push.outputs.env }} \
            --services ${{ env.PROJECT }}-backend-${{ needs.build-and-push.outputs.env }} \
            --region ${{ env.AWS_REGION }}
          echo "Backend is stable"

      - name: Wait for frontend to stabilize
        run: |
          echo "Waiting for frontend deployment to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.PROJECT }}-cluster-${{ needs.build-and-push.outputs.env }} \
            --services ${{ env.PROJECT }}-frontend-${{ needs.build-and-push.outputs.env }} \
            --region ${{ env.AWS_REGION }}
          echo "Frontend is stable"

      - name: Dump ECS failure logs
        if: failure()
        run: |
          echo "========== ECS FAILURE DIAGNOSTICS =========="

          TASK_ARN=$(aws ecs list-tasks \
            --cluster ${{ env.PROJECT }}-cluster-${{ needs.build-and-push.outputs.env }} \
            --service-name ${{ env.PROJECT }}-backend-${{ needs.build-and-push.outputs.env }} \
            --desired-status STOPPED \
            --region ${{ env.AWS_REGION }} \
            --query 'taskArns[0]' \
            --output text)

          echo "Failed task ARN: $TASK_ARN"

          aws ecs describe-tasks \
            --cluster ${{ env.PROJECT }}-cluster-${{ needs.build-and-push.outputs.env }} \
            --tasks $TASK_ARN \
            --region ${{ env.AWS_REGION }} \
            --query 'tasks[0].{stopCode:stopCode, stoppedReason:stoppedReason, containers:containers[*].{name:name, reason:reason, exitCode:exitCode}}' \
            --output json

          echo "========== CONTAINER LOGS (last 10 min) =========="
          aws logs tail /ecs/${{ env.PROJECT }}-backend-${{ needs.build-and-push.outputs.env }} \
            --since 10m \
            --region ${{ env.AWS_REGION }} || echo "No logs found (log group may differ)"

      - name: Smoke test — health check
        run: |
          echo "Running smoke test..."
          ALB_URL="http://${{ secrets.ALB_DNS_NAME }}"

          # Wait for ALB to be ready
          sleep 30

          # Hit health endpoint
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            --retry 5 \
            --retry-delay 10 \
            $ALB_URL/api/health)

          echo "Health check status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "Health check FAILED with status $STATUS"
            echo "Rolling back deployment..."

            # Rollback backend
            aws ecs update-service \
              --cluster ${{ env.PROJECT }}-cluster-${{ needs.build-and-push.outputs.env }} \
              --service ${{ env.PROJECT }}-backend-${{ needs.build-and-push.outputs.env }} \
              --force-new-deployment \
              --region ${{ env.AWS_REGION }}

            # Rollback frontend
            aws ecs update-service \
              --cluster ${{ env.PROJECT }}-cluster-${{ needs.build-and-push.outputs.env }} \
              --service ${{ env.PROJECT }}-frontend-${{ needs.build-and-push.outputs.env }} \
              --force-new-deployment \
              --region ${{ env.AWS_REGION }}

            exit 1
          fi

          echo "Health check PASSED — deployment successful"

      - name: Deployment summary
        run: |
          echo "================================"
          echo "Deployment complete!"
          echo "Environment: ${{ needs.build-and-push.outputs.env }}"
          echo "Image tag:   ${{ needs.build-and-push.outputs.image-tag }}"
          echo "App URL:     http://${{ secrets.ALB_DNS_NAME }}"
          echo "================================"
